<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Share image 1200x630, same layout as the hero and as leingruberconsulting.com: photo, gradient, logo top left, headline in narrow Archivo. */
  @font-face { font-family: "Archivo"; src: url("{{archivo}}") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #101010; color: #fff; font-family: "Archivo", sans-serif; position: relative; }
  img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; }
  .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,10,10,.82) 0%, rgba(10,10,10,.45) 45%, rgba(10,10,10,.10) 100%); }
  .logo { position: absolute; left: 70px; top: 56px; display: flex; align-items: center; gap: 18px; font-size: 56px; font-weight: 800; font-stretch: 78%; letter-spacing: -0.01em; line-height: 1; }
  .logo img { width: 58px; height: 58px; }
  .text { position: absolute; left: 70px; right: 70px; bottom: 62px; }
  /* Narrow column: the headline falls into three even lines ("Steer Google Ads / through Claude, / with guardrails."). */
  h1 { margin: 0; max-width: 820px; font-size: 88px; line-height: 0.96; font-weight: 800; font-stretch: 78%; letter-spacing: -0.015em; }
</style>
</head>
<body>
  <img class="bg" src="{{hero}}" alt="">
  <div class="shade"></div>
  <div class="logo"><img src="{{logo}}" alt="">ads-pilot</div>
  <div class="text"><h1>{{headline}}</h1></div>
</body>
</html>
