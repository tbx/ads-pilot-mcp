# ads-pilot profile. Step-by-step guide: docs/setup.md
# Copy to profiles/<name>.yaml. Stays on your computer, never goes to git.

auth:                                # filled in by: uv run ads-pilot-login <name>
  client_id: ""
  client_secret: ""
  refresh_token: ""                  # never share this value

login_customer_id: ""                # manager account (MCC) ID, or "" if none

default_customer_id: "123-456-7890"  # account used when none is named

accounts:                            # access level per account, all others are read only:
  "123-456-7890": standard           #   read_only, standard (daily work) or full (also bid strategies, portfolios, conversions)

max_daily_budget: 100                # highest daily budget per campaign, in account currency
max_budget_change_percent: 50        # largest budget change per step, in percent
max_negative_keywords_per_call: 50   # most negative keywords per call
allow_campaign_status_change: true  # false = Claude may not pause or enable whole campaigns
allow_location_changes: true        # false = Claude may not change location targeting
max_target_change_percent: 30       # largest change of target CPA or ROAS per step, in percent
max_target_cpa:                      # highest target CPA, empty = only the percent limit
max_cpc:                             # highest max CPC for manual bids and Maximize clicks, empty = no cap
allowed_bidding_strategies:          # e.g. [MAXIMIZE_CONVERSIONS, TARGET_SPEND], empty = all supported
conversion_remove_lookback_days: 90  # remove conversion actions only without conversions in this many days
max_conversion_actions_per_call: 50  # most conversion actions per call
